# Reverse proxy for tradingview.stan-buren.ru → UDF server
# Deployed behind Traefik on the home server.
# Change the proxy_pass IP below to match your UDF server.
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server {
    listen 80;
    server_name tradingview.stan-buren.ru;
    
    # Landing page → interactive demo
    location = / {
      return 302 /demo/;
    }
    
    # Proxy all requests to the UDF server
    location / {
      proxy_pass http://192.168.0.93:8089;  # ← your UDF server
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
    
    location /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }
  }
}
