<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TradingView UDF — Binance &amp; ENTSO-E</title>
<script src="lightweight-charts.standalone.production.js"></script>
<script>
class UDFDatafeed {
    constructor(baseUrl) { this._baseUrl = baseUrl || ""; }
    onReady(cb) {
        fetch(`${this._baseUrl}/config`).then(r=>r.json()).then(c=>setTimeout(()=>cb(c),0)).catch(()=>cb({supported_resolutions:["1","5","15","60","240","1D","1W","1M"],exchanges:[],symbols_types:[]}));
    }
    searchSymbols(q, ex, ty, cb) {
        let u = `${this._baseUrl}/search?query=${encodeURIComponent(q)}&limit=30`;
        if (ty) u += `&type=${ty}`;
        fetch(u).then(r=>r.json()).then(d=>cb(d.map(i=>({symbol:i.symbol,full_name:i.symbol,description:i.description,exchange:i.exchange||"",ticker:i.ticker||i.symbol,type:i.type||"crypto"})))).catch(()=>cb([]));
    }
    resolveSymbol(sym, ok, err) {
        fetch(`${this._baseUrl}/symbols?symbol=${encodeURIComponent(sym)}`).then(r=>{if(!r.ok)throw new Error("not found");return r.json()}).then(si=>ok({
            name:si.name,ticker:si.ticker||si.name,description:si.description,type:si.type||"crypto",
            session:si.session||"24x7",timezone:si.timezone||"Etc/UTC",exchange:si.exchange||"",
            minmov:si.minmov||1,pricescale:si.pricescale||100,
            has_intraday:si.has_intraday!==false,has_daily:si.has_daily!==false,has_weekly_and_monthly:si.has_weekly_and_monthly!==false,
            supported_resolutions:si.supported_resolutions||["1","5","15","60","240","1D","1W","1M"],
            intraday_multipliers:si.intraday_multipliers||["1","5","15","60","240"],
            volume_precision:si.volume_precision||8,data_status:si.data_status||"streaming",format:si.format||"price"
        })).catch(e=>{console.error(e);err(e.message)});
    }
    getBars(si, res, pp, ok, err) {
        const {from,to,countBack} = pp;
        let u = `${this._baseUrl}/history?symbol=${encodeURIComponent(si.name)}&resolution=${res}&to=${to}`;
        if (countBack>0) u += `&countback=${countBack}`;
        else if (from>0) u += `&from=${from}`;
        else u += "&countback=300";
        fetch(u).then(r=>r.json()).then(d=>{
            if (d.s==="ok") {
                if (d.t.length>0) {
                    const bars = [];
                    for (let i=0;i<d.t.length;i++) bars.push({time:d.t[i],open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]});
                    ok(bars,{noData:false,nextTime:d.nextTime||null});
                } else {
                    ok([],{noData:true,nextTime:to||null});
                }
            } else if (d.s==="no_data") {
                ok([],{noData:true,nextTime:d.nextTime||null});
            } else if (d.s==="error") {
                err(d.errmsg||"Server error");
            } else {
                ok([],{noData:true,nextTime:to||null});
            }
        }).catch(e=>{console.error(e);err(e.message)});
    }
    subscribeBars(si, res, cb, uid) { this._pollBars(si,res,cb,uid); }
    unsubscribeBars(uid) { if (this._p && this._p[uid]) { clearInterval(this._p[uid]); delete this._p[uid]; } }
    _pollBars(si, res, cb, uid) {
        if (!this._p) this._p = {};
        const iv = si.type==="energy"?120000:5000;
        this._p[uid] = setInterval(()=>{
            const now = Math.floor(Date.now()/1000);
            fetch(`${this._baseUrl}/history?symbol=${encodeURIComponent(si.name)}&resolution=${res}&countback=1&to=${now}`)
                .then(r=>r.json()).then(d=>{if(d.s==="ok"&&d.t.length>0){const i=d.t.length-1;cb({time:d.t[i],open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]})}}).catch(()=>{});
        },iv);
    }
    _p = {};
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header id="header">
    <div class="header-left"><h1 class="logo"><span class="logo-tv">TradingView</span><span class="logo-sep">×</span><span id="logo-mode-text" class="logo-binance">Binance</span></h1><span class="subtitle">UDF Datafeed Demo</span></div>
    <div class="header-right">
        <select id="mode-select" class="mode-switcher"><option value="binance" selected>🔹 Binance</option><option value="energy">⚡ ENTSO-E</option></select>
        <span id="connection-status" class="status-dot" title="Server">●</span><span id="status-text">…</span>
    </div>
</header>
<div id="search-bar">
    <div id="energy-controls" style="display:none">
        <div id="zone-select-container" class="zone-scroll" data-value=""></div>
        <select id="contract-select" class="energy-selector" style="display:none"><option value="Day-ahead">Day-ahead</option><option value="Intraday">Intraday</option></select>
        <button id="energy-load-btn" class="load-btn">Load</button>
    </div>
    <div id="binance-controls">
        <input type="text" id="symbol-input" placeholder="Search… (BTCUSDT, ETHUSDT)" autocomplete="off"/>
        <div id="search-results" class="hidden"></div>
    </div>
</div>
<div id="chart-container"><div id="chart" style="display:none"></div><div id="no-symbol" class="placeholder"><div class="placeholder-icon">📊</div><div class="placeholder-text" id="placeholder-text">Search for a symbol</div><div class="placeholder-hint" id="placeholder-hint">BTCUSDT, ETHUSDT or DE-LU Energy</div></div></div>
<footer id="info-bar">
    <div class="info-item"><span class="info-label">Mode</span><span class="info-value" id="info-mode">Binance</span></div>
    <div class="info-item" id="info-symbol-box"><span class="info-label">Symbol</span><span class="info-value" id="info-symbol">--</span></div>
    <div class="info-item" id="info-res-box"><span class="info-label">Res</span><select id="resolution-select"></select></div>
    <div class="info-item" id="info-feed-box"><span class="info-label">Feed</span><span class="info-value">UDF REST</span></div>
</footer>
</div>
<script>
const BASE="", R_CRYPTO=["1","5","15","60","240","1D","1W","1M"], R_ENERGY=["15","60","240","1D","1W","1M"];
let chart=null,series=null,curSym=null,curRes="60",curMode="binance",df=new UDFDatafeed(BASE),_activeUid=null;

function _resizeChart() {
    if (!chart) return;
    const c = document.getElementById("chart-container");
    if (c.clientWidth > 0 && c.clientHeight > 0) chart.applyOptions({ width: c.clientWidth, height: c.clientHeight });
}

function setResolutions(mode) {
    const sel=document.getElementById("resolution-select"), list=mode==="energy"?R_ENERGY:R_CRYPTO;
    sel.innerHTML=list.map(r=>`<option value="${r}" ${r===curRes?"selected":""}>${r==="1"?"1m":r==="5"?"5m":r==="15"?"15m":r==="60"?"1h":r==="240"?"4h":r}</option>`).join("");
}

async function init() {
    setResolutions("binance");
    try { const r=await fetch("/health"); if(r.ok){ const h=await r.json().catch(()=>({})); setStatus(true,"OK"); } } catch { setStatus(true,"Live"); }
    if (typeof LightweightCharts==="undefined") return setStatus(false,"Chart lib failed");
    chart=LightweightCharts.createChart(document.getElementById("chart"),{
        width:document.getElementById("chart-container").clientWidth,height:document.getElementById("chart-container").clientHeight,
        layout:{background:{type:"solid",color:"#131722"},textColor:"#d1d4dc"},
        grid:{vertLines:{color:"rgba(42,46,57,0.5)"},horzLines:{color:"rgba(42,46,57,0.5)"}},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
        rightPriceScale:{borderColor:"rgba(197,203,206,0.3)"},
        timeScale:{borderColor:"rgba(197,203,206,0.3)",timeVisible:true,secondsVisible:false,fixLeftEdge:true,fixRightEdge:true,barSpacing:8},
    });
    series=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderDownColor:"#ef5350",borderUpColor:"#26a69a",wickDownColor:"#ef5350",wickUpColor:"#26a69a"});
    window.addEventListener("resize",()=>{if(chart)chart.applyOptions({width:document.getElementById("chart-container").clientWidth,height:document.getElementById("chart-container").clientHeight})});
    document.getElementById("mode-select").addEventListener("change",switchMode);
    document.getElementById("resolution-select").addEventListener("change",e=>{curRes=e.target.value;if(curSym)loadSymbol(curSym)});
    document.getElementById("energy-load-btn").addEventListener("click",loadEnergySymbol);
    setupSearch();
}

async function switchMode() {
    curMode=document.getElementById("mode-select").value;
    document.getElementById("info-mode").textContent=curMode==="energy"?"ENTSO-E European electricity prices · EUR/MWh":"Binance";
    if (curMode==="energy") {
        curRes="60"; setResolutions("energy");
        document.getElementById("binance-controls").style.display="none";
        document.getElementById("energy-controls").style.display="flex";
        document.getElementById("info-symbol-box").style.display="none";
        document.getElementById("info-res-box").style.display="none";
        document.getElementById("info-feed-box").style.display="none";
        document.getElementById("logo-mode-text").textContent="ENTSO-E"; document.getElementById("logo-mode-text").className="logo-energy";
        document.getElementById("placeholder-text").textContent="Select a bidding zone"; document.getElementById("placeholder-hint").textContent="Day-ahead prices — EUR per megawatt-hour";
        await loadEnergyZones();
        _resizeChart();
    } else {
        curRes="60"; setResolutions("binance");
        document.getElementById("info-symbol-box").style.display="";
        document.getElementById("info-res-box").style.display="";
        document.getElementById("info-feed-box").style.display="";
        document.getElementById("binance-controls").style.display="block";
        document.getElementById("energy-controls").style.display="none";
        document.getElementById("logo-mode-text").textContent="Binance"; document.getElementById("logo-mode-text").className="logo-binance";
        document.getElementById("placeholder-text").textContent="Search for a symbol"; document.getElementById("placeholder-hint").textContent="BTCUSDT, ETHUSDT, SOLUSDT";
        _resizeChart();
    }
}

async function loadEnergyZones() {
    const ctr=document.getElementById("zone-select-container"); ctr.innerHTML='<div class="loading-zones">Loading…</div>';
    try {
        const r=await fetch("/search?query=&type=energy&limit=200"), d=await r.json();
        const zones=new Map();
        for (const i of d) { const c=i.symbol.split(":")[0]; if (!zones.has(c)) zones.set(c,i.description.split(" — ")[0]||c); }
        if (zones.size===0) { ctr.innerHTML='<div class="no-zones">No zones</div>'; return; }
        ctr.innerHTML='';
        [...zones.entries()].sort((a,b)=>a[1].localeCompare(b[1])).forEach(([code,name])=>{
            const b=document.createElement("button"); b.className="zone-btn"; b.textContent=name; b.dataset.code=code;
            b.addEventListener("click",()=>{ctr.querySelectorAll(".zone-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");ctr.dataset.value=code});
            ctr.appendChild(b);
        });
        const first=ctr.querySelector(".zone-btn"); if(first){first.classList.add("active");ctr.dataset.value=first.dataset.code;}
    } catch { ctr.innerHTML='<div class="no-zones">Failed</div>'; }
}

function loadEnergySymbol() {
    const z=document.getElementById("zone-select-container").dataset.value;
    if (!z) return;
    loadSymbol(z+":DA");
}

function setStatus(ok,txt) { const d=document.getElementById("connection-status"),t=document.getElementById("status-text"); d.className="status-dot "+(ok?"online":"offline"); t.textContent=txt; }

function setupSearch() {
    const inp=document.getElementById("symbol-input"), res=document.getElementById("search-results"); let tmr=null;
    inp.addEventListener("input",()=>{clearTimeout(tmr);const q=inp.value.trim();if(!q){res.classList.add("hidden");return}
        tmr=setTimeout(()=>{df.searchSymbols(q,"","",items=>{res.innerHTML=items.length?items.slice(0,15).map(i=>`<div class="search-item" data-symbol="${i.symbol}"><span class="symbol-name">${i.symbol}</span><span class="symbol-desc">${i.description}</span></div>`).join(""):'<div class="search-item no-results">None</div>';res.classList.remove("hidden");res.querySelectorAll(".search-item").forEach(el=>el.addEventListener("click",()=>{inp.value=el.dataset.symbol;res.classList.add("hidden");loadSymbol(el.dataset.symbol)}))})},250)});
    document.addEventListener("click",e=>{if(!res.contains(e.target)&&e.target!==inp)res.classList.add("hidden")});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=res.querySelector(".search-item");if(f&&f.dataset.symbol){loadSymbol(f.dataset.symbol);inp.value=f.dataset.symbol;res.classList.add("hidden")}}});
}

function loadSymbol(sym) {
    curSym=sym.toUpperCase(); document.getElementById("info-symbol").textContent=curSym;
    document.getElementById("no-symbol").style.display="none"; document.getElementById("chart").style.display="block";
    df.resolveSymbol(curSym,si=>{
        const isEnergy = si.type === "energy";
        chart.applyOptions({
            rightPriceScale: { title: isEnergy ? "EUR/MWh" : "" }
        });
        const to=Math.floor(Date.now()/1000);
        df.getBars(si,curRes,{from:0,to,countBack:300,firstDataRequest:true},bars=>{if(bars.length>0){const safe=bars.filter(b=>b.high>0&&b.low>0&&b.high/b.low<100&&b.low/b.high<100);if(safe.length>0){series.setData(safe);chart.timeScale().fitContent();_resizeChart()}}},e=>console.error(e));
        if (_activeUid) df.unsubscribeBars(_activeUid);
        const uid=curSym+"_"+curRes; _activeUid=uid;
        df.subscribeBars(si,curRes,bar=>{try{series.update(bar)}catch{}},uid);
    },e=>{console.error(e);document.getElementById("no-symbol").style.display="flex";document.getElementById("no-symbol").querySelector(".placeholder-text").textContent="Not found: "+curSym});
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
